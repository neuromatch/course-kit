# Runs on `git commit` after `make setup`. Same checks as CI's lint job.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (Python)
        entry: python/.venv/bin/ruff check
        language: system
        types: [python]
      - id: biome
        name: biome (JS)
        entry: js/node_modules/.bin/biome lint --config-path=js --error-on-warnings
        language: system
        files: ^(js/src|js/build\.mjs|tests/js)/
        types: [javascript]
