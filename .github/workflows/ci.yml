# The kit's own CI: unit tests (Python + JS), both bundle builds, the example
# course built with the dev bundle plus the browser smoke test, and the
# reusable course-check workflow run against the example course.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.12 && uv pip install -e "python[test]" -r example-course/requirements.txt
      - run: uv run pytest -q tests/python

  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Release build + tests
        run: npm run build && npm test
      - name: Dev build + tests
        run: npm run build:dev && npm test

  example-course:
    needs: [python, js]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Install
        run: |
          uv venv python/.venv --python 3.12
          VIRTUAL_ENV=python/.venv uv pip install -e "python[test]" -r example-course/requirements.txt
          (cd js && npm ci --no-audit --no-fund)
      - name: Build the example course
        run: scripts/build-example.sh
      # Cold Pyodide/JupyterLite downloads make the first run timing-sensitive,
      # so failed tests are retried once.
      - name: Browser smoke test
        run: |
          python/.venv/bin/playwright install --with-deps chromium
          (cd example-course/_build/html && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 2
          NMA_E2E_URL=http://localhost:8765 python/.venv/bin/pytest -q --reruns 1 tests/e2e

  course-check:
    needs: [python, js]
    uses: ./.github/workflows/course-check.yml
    with:
      working-directory: example-course
      kit-source: local
