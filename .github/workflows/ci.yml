# The kit's own CI, on pull requests: unit tests (Python + JS), both bundle
# builds, the example course built with the dev bundle plus the browser smoke
# test, and the reusable course-check workflow run against the example course.
name: CI

# Pull requests only. Branch protection requires PRs to be up to date with
# main before merging, so the PR run is the run of what lands on main.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Workflow syntax and the shell inside `run:` steps (shellcheck is in the image).
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  # Ruff (Python) and Biome (JS), through `make lint`. Config: ruff.toml, js/biome.json.
  # The jobs below call the same Makefile targets a contributor runs locally.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version-file: .tool-versions
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: js
      - run: uv venv python/.venv && VIRTUAL_ENV=python/.venv uv pip install ruff
      - run: make lint

  # The release builds with these targets on a fresh runner, so run them the same
  # way here: from a clean checkout, with no dist/ left over from another step.
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version-file: .tool-versions
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: js
      - name: Build every release artifact
        run: make dist
      - name: Each package has what the release publishes
        run: |
          ls dist/*.whl dist/*.tar.gz dist/*.tgz
          tar tzf dist/*.tgz | grep -q '^package/dist/nma.yml$'

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version-file: .tool-versions
      - run: uv venv python/.venv && VIRTUAL_ENV=python/.venv uv pip install -e "python[test]" -r tests/example-course/requirements.txt
      - run: make test-py

  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Dev and release builds + tests
        run: make test-js
        working-directory: .

  # The slowest job. A release PR only changes version strings and the
  # changelog, so it is skipped there (a skipped job counts as passing for
  # required checks).
  # It builds the JS bundle itself, so it runs in parallel with the unit tests.
  example-course:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version-file: .tool-versions
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Install
        run: |
          uv venv python/.venv
          VIRTUAL_ENV=python/.venv uv pip install -e "python[test]" -r tests/example-course/requirements.txt
          (cd js && npm ci --no-audit --no-fund)
      - name: Build the example course
        run: tests/scripts/build-example.sh
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('python/pyproject.toml', 'python/uv.lock') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install the browser
        run: python/.venv/bin/playwright install --with-deps chromium
      # Every page with editable cells boots its own Pyodide kernel (a minute
      # or more on a runner), which is what makes this slow; the tests are
      # independent, so they run in parallel (-n 4: the runner has 4 cores).
      # Cold downloads make the first run timing-sensitive, so failed tests are
      # retried once. --durations shows where the time goes.
      - name: Browser smoke test
        run: |
          (cd tests/example-course/_build/html && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 2
          NMA_E2E_URL=http://localhost:8765 python/.venv/bin/pytest -v --durations=15 --reruns 1 -n 4 tests/e2e

  course-check:
    needs: [python, js]
    uses: ./.github/workflows/course-check.yml
    with:
      working-directory: tests/example-course
      kit-source: local
