name: Feature request
description: Suggest a change to the kit
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The course-authoring situation you are in, before any proposed solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like the kit to do?
