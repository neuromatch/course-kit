[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuromatch-course-kit"
version = "0.1.8"
description = "Neuromatch course kit: notebook generation, content checks and site preparation for MyST courses"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
dependencies = [
  "mystmd==1.11.0",
  "jupytext>=1.16",
  "nbclient",
  "nbformat",
  "ipykernel",
  "pyyaml",
]

[project.optional-dependencies]
# matplotlib, numpy, ipywidgets: the render tests execute plotting cells.
test = ["pytest", "pytest-rerunfailures", "pytest-xdist", "playwright", "matplotlib", "numpy", "ipywidgets"]

# Contributor tooling (make setup): linter and the git hook runner.
dev = ["ruff", "pre-commit"]

[project.scripts]
nma-kit = "nma_kit.cli:main"

# The workflow copy is gitignored (make sync-templates), and hatch leaves gitignored files out of the
# sdist unless they are listed here. `uv build` makes the wheel from the sdist, so it would be lost.
[tool.hatch.build.targets.sdist]
artifacts = ["src/nma_kit/templates/workflows/course.yml"]

[tool.hatch.build.targets.wheel]
packages = ["src/nma_kit"]

[project.urls]
Homepage = "https://github.com/neuromatch/course-kit"
Issues = "https://github.com/neuromatch/course-kit/issues"
