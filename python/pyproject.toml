[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuromatch-course-kit"
version = "0.1.6"
description = "Neuromatch course kit: notebook generation, content checks and site preparation for MyST courses"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
dependencies = [
  "mystmd==1.11.0",
  "jupytext>=1.16",
  "nbclient",
  "nbformat",
  "ipykernel",
  "pyyaml",
]

[project.optional-dependencies]
# matplotlib, numpy, ipywidgets: the render tests execute plotting cells.
test = ["pytest", "pytest-rerunfailures", "pytest-xdist", "playwright", "matplotlib", "numpy", "ipywidgets"]

[project.scripts]
nma-kit = "nma_kit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nma_kit"]

[project.urls]
Homepage = "https://github.com/neuromatch/course-kit"
Issues = "https://github.com/neuromatch/course-kit/issues"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["../tests/example-course"]

[tool.ruff.lint]
# E/F/W: pycodestyle and pyflakes; I: import order; B: likely bugs; UP: modern syntax;
# D100-D103: every public module, class, method and function has a docstring.
select = ["E", "F", "W", "I", "B", "UP", "D100", "D101", "D102", "D103"]
ignore = [
  "E501",  # long lines: some are generated-code templates
  "UP031", # %-formatting is used on purpose in a few templates
]

[tool.ruff.lint.per-file-ignores]
"../tests/**" = ["E402", "D"]  # tests group imports with the code they test
