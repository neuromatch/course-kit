# Copy to .github/workflows/course.yml in your course repo.
# Pull requests are checked and get a public preview on Cloudflare Pages (see
# the README, "Pull request previews"); pushes to main publish the notebooks
# and the site.
# @v0.4 = the newest 0.4.x release (compatible updates, applied on every build).
# Pin an exact version (e.g. @v0.4.0) to freeze a finished course.
name: Course

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

jobs:
  check:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    uses: neuromatch/course-kit/.github/workflows/course-check.yml@v0.4

  publish:
    if: github.event_name != 'pull_request'
    uses: neuromatch/course-kit/.github/workflows/course-publish.yml@v0.4
    # Optional instructor site (solutions inline, instructor notebooks), deployed to
    # this Cloudflare Pages project: set the variable CLOUDFLARE_INSTRUCTOR_PROJECT
    # and the CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets (README, "Instructor
    # site"). Empty or unset: no instructor site.
    with:
      instructor-cloudflare-project: ${{ vars.CLOUDFLARE_INSTRUCTOR_PROJECT }}
    secrets: inherit
    permissions:
      contents: write
      pages: write
      id-token: write

  # Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets and the
  # CLOUDFLARE_PROJECT variable; without them the deploy is skipped. Delete
  # this job if the course does not want previews.
  preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: neuromatch/course-kit/.github/workflows/course-preview.yml@v0.4
    with:
      pr-number: ${{ github.event.pull_request.number }}
      action: ${{ github.event.action == 'closed' && 'cleanup' || 'deploy' }}
      cloudflare-project: ${{ vars.CLOUDFLARE_PROJECT }}
      # Also preview the instructor site: the project the `publish` job deploys it to.
      # Empty or unset: no instructor preview.
      instructor-cloudflare-project: ${{ vars.CLOUDFLARE_INSTRUCTOR_PROJECT }}
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
